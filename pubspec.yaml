name: pmj_application
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.0
  # Compatible Firebase packages versions - using stable versions
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.4
  firebase_storage: ^11.6.0
  firebase_ui_firestore: ^1.6.3
  pdf: ^3.10.8
  share_plus: ^11.1.0
  intl: ^0.20.2
  path_provider: ^2.1.2

  sqflite: ^2.3.0
  provider: ^6.1.5+1
  flutter_cache_manager: ^3.3.1
  path: ^1.8.3
  flutter_launcher_icons: ^0.14.3
  shared_preferences: ^2.2.2
  photo_view: ^0.15.0
  dropdown_search: ^6.0.2
  connectivity_plus: ^6.1.5
  universal_html: ^2.2.4
  shimmer: ^3.0.0
  url_launcher: ^6.2.4
  uuid: ^4.5.1
  hugeicons: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  analyzer: ^5.13.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "lib/assets/images/PMJ Logo.png" 

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter_24pt-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
